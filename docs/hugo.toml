baseURL = "https://sandwichcake.laiqwq.com/"
title = "sandwichcake"
locale = "en-US"

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser.attribute]
      block = true
      title = true
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Quickstart"
    pageRef = "/docs/getting-started/quickstart"
    weight = 2
  [[menu.main]]
    name = "CLI"
    pageRef = "/docs/cli"
    weight = 3
  [[menu.main]]
    name = "Search"
    weight = 4
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/laiaqwq/sandwichcake"
    weight = 5
    [menu.main.params]
      icon = "github"

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "images/logo.svg"
      width = 22
      height = 29

  [params.footer]
    displayCopyright = true
    displayPoweredBy = true

  [params.editURL]
    enable = true
    base = "https://github.com/laiaqwq/sandwichcake/edit/main/docs/content"

  [params.search]
    enable = true
    type = "flexsearch"
    # vendored so builds do not hit cdn.jsdelivr.net
    [params.search.flexsearch]
      js = "js/flexsearch.bundle.min.js"

  [params.sidebar]
    displayTitle = true

  [params.page]
    [params.page.theme]
      default = "system"
